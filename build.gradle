buildscript {
    repositories {
        maven { url 'https://maven.aliyun.com/repository/public' }
        maven { url 'https://maven.aliyun.com/repository/gradle-plugin' }
        maven { name = 'Fabric'; url = 'https://maven.fabricmc.net/' }
        maven { url = 'https://api.modrinth.com/maven' }
        mavenCentral()
        gradlePluginPortal()
    }
    dependencies {
        classpath "net.fabricmc:fabric-loom:${loom_version}"
    }
}

plugins {
    id 'maven-publish'
}

def minecraftVer = stonecutter.current.version
def versionRange = project.findProperty("version_range") ?: minecraftVer

version = project.mod_version
group = project.maven_group

// 26.1+ 原生使用官方(Mojang)名；更早的版本走 official -> intermediary 重映射。
def modern = stonecutter.eval(minecraftVer, ">=26.1")
if (modern) {
    apply plugin: 'net.fabricmc.fabric-loom'
} else {
    apply plugin: 'net.fabricmc.fabric-loom-remap'
}

base {
    archivesName = "${project.archives_base_name}-${versionRange}"
}

repositories {
    maven {
        url = 'https://maven.fabricmc.net/'
    }
    maven {
        url = 'https://api.modrinth.com/maven'
    }
    mavenCentral()
}

def pre12111 = stonecutter.eval(minecraftVer, "<1.21.11")
// 26.x 原生重映射，AW 保持 official 命名空间；更早的节点解析成 named。
def pre261 = !modern
// Groovy 闭包必须写成显式参数形式，无参闭包会把调用解析到外层 extension。
// 每条规则的 from 字符串都不能出现在 26.x 源码里，否则套用到新节点时会反向改坏。
def legacyAW = { b -> b.replace("classTweaker  v1  official", "classTweaker v1 named") }
def legacyIds = { b ->
    b.replace("net.minecraft.world.entity.vehicle.minecart.AbstractMinecart",
            "net.minecraft.world.entity.vehicle.AbstractMinecart")
    b.replace("net.minecraft.resources.Identifier", "net.minecraft.resources.ResourceLocation")
    // 裸类名也要换：Identifier.tryParse(...) / "Identifier id = ..."
    b.replace("Identifier", "ResourceLocation")
}

stonecutter {
    // 源文件里的表头字面量用了两个空格，所以上面也写两个
    replacements.string(pre261, legacyAW)
    replacements.string(pre12111, legacyIds)
}

// 文件名必须与 fabric.mod.json 里声明的一致：loom 按该名字把它复制进 jar。
def awFile = sc.process(rootProject.file("src/main/resources/safesave.classtweaker"),
        ".gradle/aw/safesave.classtweaker")

loom {
    accessWidenerPath = awFile

    mods {
        "safesave" {
            sourceSet sourceSets.main
        }
    }

    runConfigs.all {
        ideConfigGenerated true
        runDir "../../run"
    }

    def auditVmArgs = ['-Dsafesave.mixin_audit=true']

    runs {
        serverMixinAudit {
            server()
            vmArgs auditVmArgs
            // 与共享的 run/ 隔离：那里带着开发者自己玩的 mod，且锁定在某个版本。
            runDir "../../run-mixinaudit"
            ideConfigGenerated false
        }
        clientMixinAudit {
            client()
            vmArgs auditVmArgs
            runDir "../../run-mixinaudit"
            ideConfigGenerated false
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${stonecutter.current.project}"
    if (!modern) {
        mappings loom.officialMojangMappings()
        modImplementation "net.fabricmc:fabric-loader:${property("loader_version")}"
        // 1.21.x 不会传递依赖 jspecify；26.x 会。
        compileOnly "org.jspecify:jspecify:1.0.0"
    } else {
        implementation "net.fabricmc:fabric-loader:${property("loader_version")}"
    }
}

processResources {
    inputs.property "minecraft", stonecutter.current.version

    filesMatching("fabric.mod.json") {
        expand([
                "minecraftVer": project.findProperty("minecraft_ver") ?: stonecutter.current.version,
                "modVer"      : mod_version
        ])
    }
}

// 审计在游戏内运行并以退出码给出结论，但 Fabric 启动失败时进程仍退出 0，所以只看退出码不可靠：
// 必须出现审计自己的成功标记，否则视为失败。
tasks.matching { it.name == "runServerMixinAudit" || it.name == "runClientMixinAudit" }.configureEach { t ->
    def auditLog = new File(layout.buildDirectory.get().asFile, "mixin-audit-${t.name}.log")
    t.ignoreExitValue = true
    t.doFirst {
        auditLog.parentFile.mkdirs()
        def stream = new FileOutputStream(auditLog)
        t.standardOutput = stream
        t.errorOutput = stream
    }
    t.doLast {
        def text = auditLog.exists() ? auditLog.getText("UTF-8") : ""
        if (text.contains("Mixin audit result: successful")) {
            logger.lifecycle("Mixin audit OK: ${project.path} (${t.name})")
            return
        }
        def tail = text.length() > 12000 ? text.substring(text.length() - 12000) : text
        logger.error(tail)
        throw new GradleException("Mixin audit FAILED for ${project.path}: '${t.name}' did not report "
                + "'Mixin audit result: successful'. Full log: ${auditLog}")
    }
}

def javaVersion = modern ? JavaVersion.VERSION_25 : JavaVersion.VERSION_21

java {
    sourceCompatibility = javaVersion
    targetCompatibility = javaVersion
}

jar {
    inputs.property "archivesName", project.base.archivesName

    from(rootProject.file("LICENSE")) {
        rename { "${it}_${inputs.properties.archivesName}" }
    }
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }

    repositories {
    }
}

stonecutter {
    // 子项目配置
}
