pluginManagement {
    repositories {
        maven {
            url 'https://maven.aliyun.com/repository/public'
        }
        maven {
            url 'https://maven.aliyun.com/repository/gradle-plugin'
        }
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        maven { url = "https://api.modrinth.com/maven" }
        maven {
            name = "KikuGie Releases"
            url = "https://maven.kikugie.dev/releases"
        }
        maven {
            name = "KikuGie Snapshots"
            url = "https://maven.kikugie.dev/snapshots"
        }
        mavenCentral()
        mavenLocal()
        gradlePluginPortal()
    }
}

plugins {
    id("dev.kikugie.stonecutter") version "0.9.7"
}

stonecutter {
    kotlinController = false
    centralScript = "build.gradle"
    create(getRootProject()) {
        // 1.21.5 and older predate the ValueInput/ValueOutput layer (added in 1.21.6); the mod
        // reaches both through com.carpet.safesave.util.NbtView, so no separate backend is needed.
        versions "1.21.2", "1.21.3", "1.21.4", "1.21.5", "1.21.6", "1.21.7", "1.21.8", "1.21.9", "1.21.10", "1.21.11", "26.1", "26.2"
        vcsVersion = "26.1"
    }
}
